# Nginx site for StartupSpark on a DigitalOcean Droplet.
# Copy to /etc/nginx/sites-available/startupspark, replace the domain, then
# enable it (see docs/DEPLOYMENT.md). certbot adds the HTTPS lines itself.
server {
    listen 80;
    server_name 1-2-3-4.sslip.io;   # <- your domain

    # Uploads are limited to 5 MB by the app; leave room for the form fields.
    client_max_body_size 10M;

    # Uploaded images live on the Droplet's disk; Nginx serves them directly.
    location /uploads/ {
        alias /var/www/startupspark/public/uploads/;
        expires 30d;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append): the app rate-limits by the first address in
        # X-Forwarded-For, so a visitor must not be able to supply their own.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
